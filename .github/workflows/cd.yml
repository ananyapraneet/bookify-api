name: Bookify CD
on:
  push:
    branches:
      - main
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 977237383271.dkr.ecr.us-east-1.amazonaws.com/bookify-api
  EC2_INSTANCE_ID: i-0551c996927e05074
jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Debug GitHub context
        shell: bash
        run: |
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "Ref name: ${GITHUB_REF_NAME}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Workflow: ${GITHUB_WORKFLOW}"
          echo "Actor: ${GITHUB_ACTOR}"
          echo "SHA: ${GITHUB_SHA}"
      - name: Debug OIDC token claims
        shell: bash
        run: |
          OIDC_TOKEN=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          python - "$OIDC_TOKEN" <<'PY'
          import sys
          import json
          import base64

          token = sys.argv[1]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("OIDC issuer:", claims.get("iss"))
          print("OIDC subject:", claims.get("sub"))
          print("OIDC audience:", claims.get("aud"))
          print("OIDC repository:", claims.get("repository"))
          print("OIDC ref:", claims.get("ref"))
          PY
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::977237383271:role/bookify-github-actions
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to EC2 through SSM
        shell: bash
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Bookify deployment ${GITHUB_SHA}" \
            --parameters commands="[
              \"export HOME=/root\",
              \"git config --global --add safe.directory /opt/bookify",
              \"cd /opt/bookify\",
              \"git fetch origin main\",
              \"git reset --hard origin/main\",
              \"export ECR_REPOSITORY=${ECR_REPOSITORY}\",
              \"export IMAGE_TAG=${GITHUB_SHA}\",
              \"export AWS_REGION=${AWS_REGION}\",
              \"./scripts/deploy.sh\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: ${COMMAND_ID}"

          for attempt in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text)

            echo "Deployment status: ${STATUS}"

            case "${STATUS}" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed."

                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json

                exit 1
                ;;
            esac

            sleep 5
          done

          FINAL_STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "Status" \
            --output text)

          echo "Final deployment status: ${FINAL_STATUS}"

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [ "${FINAL_STATUS}" != "Success" ]; then
            echo "Deployment did not complete successfully."
            exit 1
          fi
